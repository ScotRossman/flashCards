name: Python Continuous Integration

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      code-quality: write
      pull-requests: read
      contents: read

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install build tool and project dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install build black pytest pytest-cov
        # Install the development extras and app so tests can import flashcardApp.
        pip install -e ".[dev]"

    - name: Check code formatting with Black
      run: |
        black --check src/ tests/

    - name: Run Test Suite with Pytest
      run: |
        pytest --cov=./src --cov-report=xml -v -s

    # 3. Upload the coverage data to GitHub
    - name: Upload code coverage report
      uses: codecov/codecov-action@v5
      with:
        file: ./coverage.xml
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false
        