name: Python Continuous Integration

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      code-quality: write
      pull-requests: read

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install build tool and project dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install build black pytest pytest-cov
        # Install your app in editable mode so pytest can find 'flashcardApp'
        pip install -e .

    - name: Check code formatting with Black
      run: |
        black --check src/ tests/

    - name: Run Test Suite with Pytest
      run: |
        pytest -v --cov=./ --cov-report=xml

    # 3. Upload the coverage data to GitHub
    - name: Upload code coverage report
      uses: actions/upload-code-coverage@v1
      with:
        file: ./coverage.xml
        language: python